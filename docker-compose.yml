name: konekte-dev
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: konekte
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm dev:setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm dev:setup}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d konekte"]
      interval: 3s
      timeout: 3s
      retries: 20
  postgres-test:
    image: postgres:17-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: konekte_test
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm dev:setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm dev:setup}
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d konekte_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-bookworm
    ports: ["127.0.0.1:56379:6379"]
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
